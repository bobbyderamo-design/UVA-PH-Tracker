// ── Scoring ───────────────────────────────────────────────────────────────
function scoreSubmission(data) {
  let score = 0;
  if ((data.phObjective || "").trim().length > 40) score += 2;
  const nonAdminSkills = (data.specialistSkills || []).filter(s => !ADMIN_TASKS.includes(s));
  if (nonAdminSkills.length > 0) score += 2;
  if ((data.patientImpact || "").trim().length > 30) score += 1;
  if (data.startDate && data.endDate) score += 1;
  const hasAdminOnly = (data.tasks || []).length > 0 &&
    (data.tasks || []).every(t => ADMIN_TASKS.includes(t));
  if (hasAdminOnly) score -= 2;
  if (!(data.adminJustification || "").trim() && hasAdminOnly) score -= 1;
  score = Math.max(0, score);
  if (score <= 2) return { score, label: "Not Ready", color: "#ef4444", bg: "#fee2e2" };
  if (score <= 4) return { score, label: "Needs Clarification", color: "#f59e0b", bg: "#fef3c7" };
  return { score, label: "Ready for Review", color: "#22c55e", bg: "#dcfce7" };
}

// ── Helpers ───────────────────────────────────────────────────────────────
function pColor(pct) {
  if (pct === 0) return "#ef4444";
  if (pct <= 50) {
    const t = pct / 50;
    return `rgb(${Math.round(239+t*(234-239))},${Math.round(68+t*(179-68))},${Math.round(68+t*(8-68))})`;
  }
  const t = (pct - 50) / 50;
  return `rgb(${Math.round(234+t*(34-234))},${Math.round(179+t*(197-179))},${Math.round(8+t*(94-8))})`;
}
function fmtDate(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}
function fmtTime(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}
function initials(name) {
  return name.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
}
function avatarColor(name) {
  const colors = ["#232D4B","#E57200","#0369a1","#7c3aed","#059669","#dc2626","#d97706"];
  let h = 0; for (let c of name) h = (h * 31 + c.charCodeAt(0)) % colors.length;
  return colors[h];
}

// ── DB ────────────────────────────────────────────────────────────────────
async function dbLoadProjects() {
  const { data, error } = await sb.from("projects").select("data").eq("id", TRACKER_ROW_ID).single();
  if (error || !data) return null;
  return data.data.map(p => ({...p, comments: p.comments||[]}));
}
async function dbSaveProjects(projects) {
  await sb.from("projects").upsert({ id: TRACKER_ROW_ID, data: projects, updated_at: new Date().toISOString() });
}
async function dbLoadSubmissions() {
  const { data, error } = await sb.from("intake_submissions").select("*").order("submitted_at", { ascending: false });
  if (error || !data) return [];
  return data;
}
async function dbSaveSubmission(formData) {
  const readiness = scoreSubmission(formData);
  const { data, error } = await sb.from("intake_submissions").insert([{
    data: { ...formData, readiness },
    submitted_at: new Date().toISOString()
  }]).select().single();
  if (error) throw error;
  return data;
}

            <div style={{fontSize:13,color:"#7c2d12",lineHeight:1.65}}>
              The tasks described may be better suited for an <strong>administrative specialist or other personnel, but not a PH Specialist</strong>. If a PH Specialist is still required, please explain why below.
            </div>
            <div style={{marginTop:12}}>
              <label style={{display:"block",fontSize:11,fontWeight:700,color:"#9a3412",marginBottom:5,letterSpacing:"0.06em",textTransform:"uppercase"}}>Why is a PH Specialist still needed? *</label>
              <textarea value={form.adminJustification} onChange={e=>setField("adminJustification",e.target.value)}
                rows={3} style={{width:"100%",padding:"9px 11px",border:"1.5px solid #fed7aa",borderRadius:8,fontSize:13,resize:"vertical",outline:"none",fontFamily:"inherit"}}
                placeholder="Explain the specific PH expertise required despite the administrative nature of these tasks…" />
            </div>
          </div>
        )}
      </FormSection>

      {/* Section 5 */}
      <FormSection title="5. Impact & Accountability">
        <Field label="Expected Patient or Community Impact" required
          hint="Describe measurable or observable outcomes. Who benefits and how?">
          <textarea value={form.patientImpact} onChange={e=>setField("patientImpact",e.target.value)}
            rows={3} style={inp({resize:"vertical",err:errors.patientImpact})}
            placeholder="e.g., Estimated 200 high-risk patients will receive proactive outreach, reducing ED utilization by 15% over 6 months…" />
          {errors.patientImpact && <div style={{fontSize:11,color:"#ef4444",marginTop:4}}>Required.</div>}
        </Field>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <Field label="Accountable Director / Leader" required>
            <input value={form.accountableDirector} onChange={e=>setField("accountableDirector",e.target.value)}
              style={inp({err:errors.accountableDirector})} placeholder="Name of director accountable for this project" />
            {errors.accountableDirector && <div style={{fontSize:11,color:"#ef4444",marginTop:4}}>Required.</div>}
          </Field>
          <Field label="Is there a defined milestone or end date?">
            <select value={form.hasMilestone} onChange={e=>setField("hasMilestone",e.target.value)} style={inp()}>
              <option value="">Select…</option>
              <option>Yes — dates entered above</option>
              <option>Yes — but dates are TBD</option>
              <option>No — ongoing initiative</option>
            </select>
          </Field>
        </div>
      </FormSection>

      {/* Submit */}
      <div style={{display:"flex",justifyContent:"flex-end",marginTop:8}}>
        <button onClick={handleSubmit} disabled={submitting}
          style={{background:submitting?"#94a3b8":"#E57200",color:"white",border:"none",borderRadius:9,padding:"13px 36px",fontSize:14,fontWeight:700,cursor:submitting?"default":"pointer",transition:"background 0.15s"}}>
          {submitting ? "Submitting…" : "Submit Request →"}
        </button>
      </div>
    </div>
  );
}

function FormSection({title, children}) {
  return (
    <div style={{background:"white",borderRadius:12,padding:24,marginBottom:16,boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
      <div style={{fontSize:13,fontWeight:800,color:"#232D4B",marginBottom:18,paddingBottom:10,borderBottom:"1px solid #f1f5f9"}}>{title}</div>
      {children}
    </div>
  );
}

// ── SUBMISSIONS REVIEW ────────────────────────────────────────────────────
function SubmissionsView() {
  const [submissions, setSubmissions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expanded, setExpanded] = useState(null);

  useEffect(() => {
    dbLoadSubmissions().then(d => { setSubmissions(d); setLoading(false); });
    // Realtime
    const ch = sb.channel("intake-changes")
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"intake_submissions"}, payload => {
        setSubmissions(s => [payload.new, ...s]);
      })
      .subscribe();
    return () => sb.removeChannel(ch);
  }, []);

  if (loading) return <div style={{padding:40,textAlign:"center",color:"#94a3b8",fontSize:14}}>Loading submissions…</div>;
  if (submissions.length === 0) return (
    <div style={{padding:60,textAlign:"center",color:"#94a3b8",fontSize:14,background:"white",borderRadius:10,margin:"0 24px"}}>
      No intake submissions yet.
    </div>
  );

  return (
    <div style={{padding:"16px 24px 40px",display:"flex",flexDirection:"column",gap:10}}>
      {submissions.map(s => {
        const d = s.data || {};
        const r = d.readiness || scoreSubmission(d);
        const isExp = expanded === s.id;
        return (
          <div key={s.id} style={{background:"white",borderRadius:10,border:"1px solid #e2e8f0",overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,0.05)"}}>
            <div style={{padding:"14px 18px",display:"flex",gap:12,alignItems:"center",flexWrap:"wrap",cursor:"pointer"}} onClick={()=>setExpanded(isExp?null:s.id)}>
              <div style={{flex:"1 1 200px"}}>
                <div style={{fontWeight:700,fontSize:13.5,color:"#1e293b"}}>{d.projectName || "Untitled"}</div>
                <div style={{fontSize:11.5,color:"#94a3b8",marginTop:3}}>
                  <span style={{marginRight:10}}>👔 {d.submittingDirector}</span>
                  <span>📅 {fmtDate(s.submitted_at)}</span>
                </div>
              </div>
              {/* Readiness badge */}
              <div style={{padding:"5px 14px",borderRadius:20,background:r.bg,color:r.color,fontSize:12,fontWeight:700,whiteSpace:"nowrap"}}>
                {r.label}
              </div>
              <div style={{fontSize:12,color:"#94a3b8",whiteSpace:"nowrap"}}>Score: <strong style={{color:r.color}}>{r.score}/6</strong></div>
              <div style={{fontSize:12,color:"#64748b",whiteSpace:"nowrap"}}>⏱ {d.weeklyHours}</div>
              <span style={{color:"#94a3b8",fontSize:13}}>{isExp?"▲":"▼"}</span>
            </div>

            {isExp && (
              <div style={{borderTop:"1px solid #f1f5f9",background:"#fafbfc",padding:"20px 24px",display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
                <DetailBlock label="PH Objective" value={d.phObjective} />
                <DetailBlock label="Patient / Community Impact" value={d.patientImpact} />
                <DetailBlock label="Specialist Skills" value={(d.specialistSkills||[]).join(", ")||"—"} />
                <DetailBlock label="Tasks" value={(d.tasks||[]).join(", ")||"—"} />
                {d.adminJustification && <DetailBlock label="Admin Override Justification" value={d.adminJustification} span />}
                <DetailBlock label="Accountable Director" value={d.accountableDirector} />
                <DetailBlock label="Division" value={d.division||"—"} />
                <DetailBlock label="Start Date" value={fmtDate(d.startDate)||"—"} />
                <DetailBlock label="End Date" value={fmtDate(d.endDate)||"—"} />
                <DetailBlock label="Weekly Hours" value={d.weeklyHours||"—"} />
                <DetailBlock label="Milestone Defined?" value={d.hasMilestone||"—"} />

                {/* Score breakdown */}
                <div style={{gridColumn:"1 / -1",background:"white",border:"1px solid #e2e8f0",borderRadius:10,padding:"14px 18px"}}>
                  <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:10}}>Readiness Score Breakdown</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                    {[
                      {label:"Clear PH Objective",     pts: (d.phObjective||"").trim().length>40 ? "+2":"+0"},
                      {label:"Non-Admin Skills",        pts: (d.specialistSkills||[]).filter(s=>!ADMIN_TASKS.includes(s)).length>0 ? "+2":"+0"},
                      {label:"Measurable Impact",       pts: (d.patientImpact||"").trim().length>30 ? "+1":"+0"},
                      {label:"Defined Timeline",        pts: (d.startDate&&d.endDate) ? "+1":"+0"},
                      {label:"Admin-Only Flag",         pts: (d.tasks||[]).length>0&&(d.tasks||[]).every(t=>ADMIN_TASKS.includes(t)) ? "-2":"0"},
                      {label:"Missing Justification",   pts: (!(d.adminJustification||"").trim()&&(d.tasks||[]).every(t=>ADMIN_TASKS.includes(t))) ? "-1":"0"},
                    ].map(item=>(
                      <div key={item.label} style={{padding:"5px 12px",borderRadius:20,background:"#f1f5f9",fontSize:12,color:"#334155"}}>
                        {item.label}: <strong style={{color:item.pts.startsWith("-")?"#ef4444":item.pts==="+0"?"#94a3b8":"#059669"}}>{item.pts}</strong>
                      </div>
                    ))}
                  </div>
                  <div style={{marginTop:12,fontSize:14,fontWeight:800,color:r.color}}>
                    Total: {r.score}/6 — {r.label}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function DetailBlock({label, value, span}) {
  return (
    <div style={{gridColumn:span?"1 / -1":"auto"}}>
      <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:4}}>{label}</div>
      <div style={{fontSize:13,color:"#334155",lineHeight:1.6}}>{value||"—"}</div>
    </div>
  );
}

// ── PROJECT TRACKER ───────────────────────────────────────────────────────
function TrackerView({ user }) {
  const [projects, setProjects]         = useState([]);
  const [loaded, setLoaded]             = useState(false);
  const [search, setSearch]             = useState("");
  const [fDir, setFDir]                 = useState("All");
  const [fSpec, setFSpec]               = useState("All");
  const [fDiv, setFDiv]                 = useState("All");
  const [fStat, setFStat]               = useState("All");
  const [expanded, setExpanded]         = useState(null);
  const [editing, setEditing]           = useState(null);
  const [ef, setEf]                     = useState({});
  const [saving, setSaving]             = useState(false);
  const [addOpen, setAddOpen]           = useState(false);
  const [newP, setNewP]                 = useState({program:"",director:"",division:"",specialist:"",priority:"Medium",notes:""});
  const [commentDrafts, setCommentDrafts] = useState({});
  const dragItem = useRef(null);
  const dragOver = useRef(null);

  const inp = (s={}) => ({padding:"9px 11px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,outline:"none",fontFamily:"inherit",width:"100%",...s});

  const load = useCallback(async () => {
    const rows = await dbLoadProjects();
    if (rows) { setProjects(rows); }
    else { await dbSaveProjects(INIT_PROJECTS); setProjects(INIT_PROJECTS); }
    setLoaded(true);
  }, []);

  useEffect(() => { load(); }, [load]);

  useEffect(() => {
    const ch = sb.channel("ph-tracker-data")
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"projects",filter:`id=eq.${TRACKER_ROW_ID}`}, payload => {
        if (payload.new?.data) setProjects(payload.new.data.map(p=>({...p,comments:p.comments||[]})));
      })
      .subscribe();
    return () => sb.removeChannel(ch);
  }, []);

  async function persist(updated) {
    setProjects(updated); setSaving(true);
    await dbSaveProjects(updated);
    setSaving(false);
  }

  function stamp(p, extra) { return {...p,...extra,by:user,when:new Date().toISOString()}; }
  function upProg(id,pct) { persist(projects.map(p=>p.id!==id?p:stamp(p,{progress:pct,status:pct===100?"Complete":pct===0?"Not Started":p.status==="Not Started"?"In Progress":p.status}))); }
  function upStat(id,status) { persist(projects.map(p=>p.id!==id?p:stamp(p,{status,progress:status==="Complete"?100:status==="Not Started"?0:p.progress}))); }
  function saveEdit() { persist(projects.map(p=>p.id===editing?{...ef,by:user,when:new Date().toISOString()}:p)); setEditing(null); }
  function addProject() { if(!newP.program.trim())return; persist([...projects,{...newP,id:Date.now(),progress:0,status:"Not Started",by:user,when:new Date().toISOString(),comments:[]}]); setNewP({program:"",director:"",division:"",specialist:"",priority:"Medium",notes:""}); setAddOpen(false); }
  function postComment(id) { const text=(commentDrafts[id]||"").trim(); if(!text)return; const comment={id:Date.now(),text,by:user,when:new Date().toISOString()}; persist(projects.map(p=>p.id!==id?p:{...p,comments:[...(p.comments||[]),comment]})); setCommentDrafts(d=>({...d,[id]:""})); }
  function deleteComment(pid,cid) { persist(projects.map(p=>p.id!==pid?p:{...p,comments:p.comments.filter(c=>c.id!==cid)})); }

  function handleDragStart(e, index) {
    dragItem.current = index;
    e.dataTransfer.effectAllowed = "move";
    e.currentTarget.style.opacity = "0.5";
  }
  function handleDragEnter(e, index) {
    dragOver.current = index;
    e.preventDefault();
  }
  function handleDragOver(e) { e.preventDefault(); }
  function handleDragEnd(e) {
    e.currentTarget.style.opacity = "1";
    if (dragItem.current === null || dragOver.current === null || dragItem.current === dragOver.current) {
      dragItem.current = null; dragOver.current = null; return;
    }
    const visibleIds = visible.map(p => p.id);
    const fromId = visibleIds[dragItem.current];
    const toId   = visibleIds[dragOver.current];
    const updated = [...projects];
    const fromIdx = updated.findIndex(p => p.id === fromId);
    const toIdx   = updated.findIndex(p => p.id === toId);
    const [moved] = updated.splice(fromIdx, 1);
    updated.splice(toIdx, 0, moved);
    dragItem.current = null; dragOver.current = null;
    persist(updated);
  }

  const dirs  = ["All",...new Set(projects.map(p=>p.director))];
  const specs = ["All",...new Set(projects.map(p=>p.specialist))];
  const divs  = ["All",...new Set(projects.map(p=>p.division))];

  const visible = projects.filter(p=>
    (fDir==="All"||p.director===fDir)&&(fSpec==="All"||p.specialist===fSpec)&&
    (fDiv==="All"||p.division===fDiv)&&(fStat==="All" ? (p.status!=="Complete"&&p.status!=="Ongoing") : p.status===fStat)&&
    (!search||[p.program,p.director,p.specialist,p.notes,p.division].some(v=>v.toLowerCase().includes(search.toLowerCase())))
  );

  const ct = { total:projects.length, ns:projects.filter(p=>p.status==="Not Started").length, ip:projects.filter(p=>p.status==="In Progress").length, og:projects.filter(p=>p.status==="Ongoing").length, oh:projects.filter(p=>p.status==="On Hold").length, done:projects.filter(p=>p.status==="Complete").length };
  const hasFilter = search||fDir!=="All"||fSpec!=="All"||fDiv!=="All"||fStat!=="All";

  if (!loaded) return <div style={{padding:60,textAlign:"center",color:"#64748b",fontSize:14}}>Loading projects…</div>;

  return (
    <div>
      {/* Stats */}
      <div style={{display:"flex",gap:10,padding:"16px 24px 12px",flexWrap:"wrap"}}>
        {[{label:"Total",value:ct.total,color:"#232D4B",key:"All"},{label:"Not Started",value:ct.ns,color:"#ef4444",key:"Not Started"},{label:"In Progress",value:ct.ip,color:"#f59e0b",key:"In Progress"},{label:"Ongoing",value:ct.og,color:"#0369a1",key:"Ongoing"},{label:"On Hold",value:ct.oh,color:"#8b5cf6",key:"On Hold"},{label:"Complete",value:ct.done,color:"#22c55e",key:"Complete"}].map(c=>(
          <div key={c.key} onClick={()=>setFStat(fStat===c.key?"All":c.key)}
            style={{flex:"1 1 110px",background:"white",borderRadius:10,padding:"11px 14px",cursor:"pointer",borderTop:`3px solid ${c.color}`,boxShadow:fStat===c.key?`0 0 0 2px ${c.color},0 2px 8px rgba(0,0,0,0.1)`:"0 1px 3px rgba(0,0,0,0.07)",transition:"box-shadow 0.15s"}}>
            <div style={{fontSize:28,fontWeight:800,color:c.color,lineHeight:1}}>{c.value}</div>
            <div style={{fontSize:11,color:"#64748b",marginTop:4,fontWeight:500}}>{c.label}</div>
          </div>
        ))}
      </div>

      {/* Filters */}
      <div style={{display:"flex",gap:8,padding:"0 24px 12px",flexWrap:"wrap",alignItems:"center"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍  Search projects…" style={{...inp({flex:"1 1 180px",width:"auto"})}} />
        {[{label:"Director",val:fDir,set:setFDir,opts:dirs},{label:"Specialist",val:fSpec,set:setFSpec,opts:specs},{label:"Division",val:fDiv,set:setFDiv,opts:divs}].map(f=>(
          <select key={f.label} value={f.val} onChange={e=>f.set(e.target.value)} style={{padding:"9px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,background:"white",outline:"none",cursor:"pointer"}}>
            <option value="All">{f.label}: All</option>
            {f.opts.filter(o=>o!=="All").map(o=><option key={o} value={o}>{o}</option>)}
          </select>
        ))}
        {hasFilter && <button onClick={()=>{setSearch("");setFDir("All");setFSpec("All");setFDiv("All");setFStat("All");}} style={{padding:"9px 14px",border:"1.5px solid #e2e8f0",borderRadius:8,background:"white",fontSize:12,cursor:"pointer",color:"#64748b"}}>✕ Clear</button>}
        <span style={{fontSize:12,color:"#94a3b8",marginLeft:"auto"}}>{visible.length} of {projects.length} projects</span>
      </div>

      {/* Add button row */}
      <div style={{padding:"0 24px 8px",display:"flex",justifyContent:"flex-end"}}>
        <button onClick={()=>setAddOpen(true)} style={{background:"#E57200",color:"white",border:"none",borderRadius:7,padding:"7px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>+ Add Project</button>
        {saving && <span style={{fontSize:11,color:"#E57200",fontStyle:"italic",marginLeft:10,alignSelf:"center"}}>Saving…</span>}
      </div>

      {/* Rows */}
      <div style={{padding:"0 24px 40px",display:"flex",flexDirection:"column",gap:8}}>
        {visible.length===0 && <div style={{textAlign:"center",padding:60,color:"#94a3b8",background:"white",borderRadius:10,fontSize:14}}>No projects match your filters.</div>}
        {visible.map((p,idx)=>{
          const col=pColor(p.progress); const isExp=expanded===p.id;
          const pri=p.priority==="High"?{bg:"#fee2e2",txt:"#dc2626"}:p.priority==="Low"?{bg:"#dcfce7",txt:"#16a34a"}:{bg:"#fef3c7",txt:"#d97706"};
          const sc=statColors[p.status]||"#94a3b8"; const commentCount=(p.comments||[]).length;
          return (
            <div key={p.id} draggable onDragStart={e=>handleDragStart(e,idx)} onDragEnter={e=>handleDragEnter(e,idx)} onDragOver={handleDragOver} onDragEnd={handleDragEnd}
              style={{background:"white",borderRadius:10,border:"1px solid #e2e8f0",boxShadow:"0 1px 3px rgba(0,0,0,0.05)",overflow:"hidden",cursor:"grab"}}>
              <div style={{padding:"12px 16px",display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
                <div style={{flex:"1 1 200px",minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13.5,color:"#1e293b",lineHeight:1.3}}>{p.program}</div>
                  <div style={{fontSize:11.5,color:"#94a3b8",marginTop:3}}><span style={{marginRight:10}}>👔 {p.director}</span><span>📂 {p.division}</span></div>
                </div>
                <div style={{fontSize:11,background:"#f8fafc",border:"1px solid #e2e8f0",padding:"3px 9px",borderRadius:20,color:"#475569",whiteSpace:"nowrap"}}>👤 {p.specialist}</div>
                <div style={{fontSize:11,padding:"3px 9px",borderRadius:20,fontWeight:700,background:pri.bg,color:pri.txt,whiteSpace:"nowrap"}}>{p.priority}</div>
                <select value={p.status} onChange={e=>upStat(p.id,e.target.value)} style={{fontSize:12,padding:"4px 8px",border:`1.5px solid ${sc}`,borderRadius:6,color:sc,fontWeight:700,outline:"none",cursor:"pointer",background:"white",whiteSpace:"nowrap"}}>
                  {STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
                </select>
                <div style={{flex:"0 0 230px",display:"flex",flexDirection:"column",gap:4}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <input type="range" min={0} max={100} value={p.progress} onChange={e=>upProg(p.id,Number(e.target.value))} style={{flex:1,accentColor:col,cursor:"pointer"}} />
                    <span style={{fontSize:13,fontWeight:800,color:col,minWidth:34,textAlign:"right"}}>{p.progress}%</span>
                  </div>
                  <div style={{height:7,background:"#f1f5f9",borderRadius:4,overflow:"hidden"}}>
                    <div style={{height:"100%",width:`${p.progress}%`,background:`linear-gradient(90deg,${pColor(Math.max(0,p.progress-10))},${col})`,borderRadius:4,transition:"width 0.35s,background 0.35s"}} />
                  </div>
                </div>
                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>setExpanded(isExp?null:p.id)} style={{height:30,padding:"0 10px",border:"1px solid #e2e8f0",borderRadius:6,background:isExp?"#f1f5f9":"white",cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",gap:5,color:"#475569",whiteSpace:"nowrap"}}>
                    {isExp?"▲":"▼"}
                    {commentCount>0&&<span style={{background:"#232D4B",color:"white",borderRadius:10,padding:"1px 6px",fontSize:10,fontWeight:700}}>{commentCount}</span>}
                  </button>
                  <button onClick={()=>{setEditing(p.id);setEf({...p});}} style={{width:30,height:30,border:"1px solid #e2e8f0",borderRadius:6,background:"white",cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center"}}>✏️</button>
                </div>
              </div>
              {isExp&&(
                <div style={{borderTop:"1px solid #f1f5f9",background:"#fafbfc"}}>
                  <div style={{padding:"14px 18px 12px",borderBottom:"1px solid #f1f5f9"}}>
                    <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:6}}>Project Notes</div>
                    <div style={{fontSize:13,color:"#334155",lineHeight:1.75}}>{p.notes||<em style={{color:"#cbd5e1"}}>No notes added.</em>}</div>
                    {p.by&&<div style={{marginTop:8,fontSize:11,color:"#cbd5e1"}}>✏️ Last updated by <strong style={{color:"#94a3b8"}}>{p.by}</strong> on {fmtDate(p.when)}</div>}
                  </div>
                  <div style={{padding:"14px 18px 16px"}}>
                    <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:12}}>Comments {commentCount>0&&`(${commentCount})`}</div>
                    {(p.comments||[]).length===0&&<div style={{fontSize:13,color:"#cbd5e1",marginBottom:14,fontStyle:"italic"}}>No comments yet — be the first to add one.</div>}
                    <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
                      {(p.comments||[]).map(c=>(
                        <div key={c.id} style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                          <div style={{width:30,height:30,borderRadius:"50%",background:avatarColor(c.by),display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"white",flexShrink:0}}>{initials(c.by)}</div>
                          <div style={{flex:1,background:"white",border:"1px solid #e2e8f0",borderRadius:"0 10px 10px 10px",padding:"9px 12px",boxShadow:"0 1px 2px rgba(0,0,0,0.04)"}}>
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                              <span style={{fontSize:12,fontWeight:700,color:"#232D4B"}}>{c.by}</span>
                              <div style={{display:"flex",alignItems:"center",gap:8}}>
                                <span style={{fontSize:11,color:"#94a3b8"}}>{fmtTime(c.when)}</span>
                                {c.by===user&&<button onClick={()=>deleteComment(p.id,c.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#cbd5e1",fontSize:13,padding:0,lineHeight:1}} title="Delete comment">✕</button>}
                              </div>
                            </div>
                            <div style={{fontSize:13,color:"#334155",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{c.text}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                    <div style={{display:"flex",gap:10,alignItems:"flex-end"}}>
                      <div style={{width:30,height:30,borderRadius:"50%",background:avatarColor(user),display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"white",flexShrink:0,marginBottom:1}}>{initials(user)}</div>
                      <div style={{flex:1,display:"flex",flexDirection:"column",gap:6}}>
                        <textarea value={commentDrafts[p.id]||""} onChange={e=>setCommentDrafts(d=>({...d,[p.id]:e.target.value}))} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();postComment(p.id);}}} placeholder="Add a comment… (Enter to post, Shift+Enter for new line)" rows={2} style={{width:"100%",padding:"9px 11px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,resize:"none",outline:"none",fontFamily:"inherit",lineHeight:1.5}} />
                        <button onClick={()=>postComment(p.id)} disabled={!(commentDrafts[p.id]||"").trim()} style={{alignSelf:"flex-end",background:(commentDrafts[p.id]||"").trim()?"#232D4B":"#e2e8f0",color:(commentDrafts[p.id]||"").trim()?"white":"#94a3b8",border:"none",borderRadius:7,padding:"7px 16px",fontSize:12,fontWeight:700,cursor:(commentDrafts[p.id]||"").trim()?"pointer":"default",transition:"background 0.15s"}}>Post Comment</button>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {editing&&(
        <Modal title="Edit Project" onClose={()=>setEditing(null)} onSave={saveEdit} saveLabel="Save Changes">
          {[{label:"Program / Project",key:"program"},{label:"Director",key:"director"},{label:"Division / Service Line",key:"division"},{label:"PH Specialist",key:"specialist"}].map(f=>(
            <div key={f.key} style={{marginBottom:14}}>
              <label style={{display:"block",fontSize:11,fontWeight:700,color:"#64748b",marginBottom:5,letterSpacing:"0.06em",textTransform:"uppercase"}}>{f.label}</label>
              <input value={ef[f.key]||""} onChange={e=>setEf({...ef,[f.key]:e.target.value})} style={inp()} />
            </div>
          ))}
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:11,fontWeight:700,color:"#64748b",marginBottom:5,letterSpacing:"0.06em",textTransform:"uppercase"}}>Priority</label>
            <select value={ef.priority||"Medium"} onChange={e=>setEf({...ef,priority:e.target.value})} style={inp()}>{PRIORITIES.map(o=><option key={o}>{o}</option>)}</select>
          </div>
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:11,fontWeight:700,color:"#64748b",marginBottom:5,letterSpacing:"0.06em",textTransform:"uppercase"}}>Notes</label>
            <textarea value={ef.notes||""} onChange={e=>setEf({...ef,notes:e.target.value})} rows={5} style={inp({resize:"vertical"})} />
          </div>
        </Modal>
      )}
      {addOpen&&(
        <Modal title="Add New Project" onClose={()=>setAddOpen(false)} onSave={addProject} saveLabel="Add Project">
          {[{label:"Program / Project",key:"program"},{label:"Director",key:"director"},{label:"Division / Service Line",key:"division"},{label:"PH Specialist",key:"specialist"}].map(f=>(
            <div key={f.key} style={{marginBottom:14}}>
              <label style={{display:"block",fontSize:11,fontWeight:700,color:"#64748b",marginBottom:5,letterSpacing:"0.06em",textTransform:"uppercase"}}>{f.label}</label>
              <input value={newP[f.key]||""} onChange={e=>setNewP({...newP,[f.key]:e.target.value})} style={inp()} />
            </div>
          ))}
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:11,fontWeight:700,color:"#64748b",marginBottom:5,letterSpacing:"0.06em",textTransform:"uppercase"}}>Priority</label>
            <select value={newP.priority||"Medium"} onChange={e=>setNewP({...newP,priority:e.target.value})} style={inp()}>{PRIORITIES.map(o=><option key={o}>{o}</option>)}</select>
          </div>
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:11,fontWeight:700,color:"#64748b",marginBottom:5,letterSpacing:"0.06em",textTransform:"uppercase"}}>Notes</label>
            <textarea value={newP.notes||""} onChange={e=>setNewP({...newP,notes:e.target.value})} rows={4} style={inp({resize:"vertical"})} />
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── ROOT APP ──────────────────────────────────────────────────────────────
function App() {
  const [user, setUser]         = useState("");
  const [nameInput, setNameInput] = useState("");
  const [tab, setTab]           = useState("tracker");
  const [liveUsers, setLiveUsers] = useState([]);
  const channelRef              = useRef(null);

  const inp = (s={}) => ({padding:"9px 11px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,outline:"none",fontFamily:"inherit",width:"100%",...s});

  useEffect(() => {
    if (!user) return;
    const channel = sb.channel("ph-presence", { config:{ presence:{ key: user } } });
    channel.on("presence",{event:"sync"},()=>{ setLiveUsers(Object.keys(channel.presenceState())); })
      .subscribe(async status => { if(status==="SUBSCRIBED") await channel.track({user,online_at:new Date().toISOString()}); });
    channelRef.current = channel;
    return () => sb.removeChannel(channel);
  }, [user]);

  if (!user) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"linear-gradient(135deg,#232D4B 0%,#1a2236 100%)"}}>
      <div style={{background:"white",borderRadius:16,padding:40,width:380,textAlign:"center",boxShadow:"0 30px 80px rgba(0,0,0,0.4)"}}>
        <div style={{width:58,height:58,background:"#232D4B",borderRadius:12,margin:"0 auto 16px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>🏥</div>
        <h2 style={{margin:"0 0 4px",color:"#232D4B",fontSize:20,fontWeight:800}}>UVA Population Health</h2>
        <p style={{color:"#94a3b8",margin:"0 0 28px",fontSize:13}}>Project Tracker & Specialist Intake</p>
        <label style={{display:"block",textAlign:"left",fontSize:11,fontWeight:700,color:"#64748b",marginBottom:6,letterSpacing:"0.06em",textTransform:"uppercase"}}>Your Name</label>
        <input value={nameInput} onChange={e=>setNameInput(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&nameInput.trim()&&setUser(nameInput.trim())}
          placeholder="Enter your name to continue..."
          style={{...inp(),marginBottom:14}} />
        <button onClick={()=>nameInput.trim()&&setUser(nameInput.trim())}
          style={{width:"100%",background:"#E57200",color:"white",border:"none",borderRadius:8,padding:"12px 0",fontSize:14,fontWeight:700,cursor:"pointer"}}>
          Enter Dashboard →
        </button>
        <p style={{fontSize:11,color:"#cbd5e1",marginTop:14}}>Updates sync live across the whole team.</p>
      </div>
    </div>
  );

  const submissionCount = tab; // just to keep linter quiet

  return (
    <div style={{minHeight:"100vh",background:"#f1f5f9"}}>

      {/* Header */}
      <div style={{background:"#232D4B",padding:"13px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,borderBottom:"3px solid #E57200",position:"sticky",top:0,zIndex:50}}>
        <div>
          <div style={{color:"white",fontWeight:800,fontSize:15}}>UVA Health · Population Health</div>
          <div style={{color:"rgba(255,255,255,0.55)",fontSize:11.5,marginTop:1}}>Project Tracker & Specialist Intake</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          {liveUsers.length>0&&(
            <div style={{display:"flex",alignItems:"center",gap:4}}>
              <span style={{width:7,height:7,borderRadius:"50%",background:"#22c55e",display:"inline-block"}} />
              <span style={{fontSize:11,color:"rgba(255,255,255,0.6)"}}>{liveUsers.length===1?"Just you":`${liveUsers.length} online`}</span>
              <div style={{display:"flex",marginLeft:4}}>
                {liveUsers.slice(0,5).map(u=>(
                  <div key={u} title={u} style={{width:22,height:22,borderRadius:"50%",background:avatarColor(u),display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,color:"white",border:"1.5px solid #232D4B",marginLeft:-4}}>{initials(u)}</div>
                ))}
              </div>
            </div>
          )}
          <div style={{background:"rgba(255,255,255,0.12)",color:"white",fontSize:12,padding:"6px 14px",borderRadius:20,display:"flex",alignItems:"center",gap:6}}>
            <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:22,height:22,borderRadius:"50%",background:avatarColor(user),fontSize:10,fontWeight:700}}>{initials(user)}</span>
            {user}
          </div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{background:"white",borderBottom:"1px solid #e2e8f0",padding:"0 24px",display:"flex",gap:0}}>
        {[
          {key:"tracker",    label:"📋  Project Tracker"},
          {key:"intake",     label:"📝  Submit Request"},
          {key:"submissions",label:"🔍  Intake Submissions"},
        ].map(t=>(
          <button key={t.key} className={`tab-btn${tab===t.key?" active":""}`} onClick={()=>setTab(t.key)}>
            {t.label}
          </button>
        ))}
      </div>

      {/* Tab content */}
      {tab==="tracker"     && <TrackerView user={user} />}
      {tab==="intake"      && <IntakeForm onSubmitted={()=>setTab("submissions")} />}
      {tab==="submissions" && <SubmissionsView />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
